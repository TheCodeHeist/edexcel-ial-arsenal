<!DOCTYPE html><html><head><link rel="stylesheet" href="../css/playground.css"><script src="../js/playground.js"></script><script>Playground.initTheme();addEventListener("storage",e=>{if(!e.key||!e.key.startsWith("chem-"))return;const g=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};Playground.setTheme({palette:g("chem-palette","catppuccin"),mode:g("chem-mode","auto")});});</script><meta charset="utf-8"><style>body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}</style></head><body>
<div style="position:relative;height:384px;overflow:hidden;border-radius:16px;border:1px solid var(--rim);background:var(--bg)"><div class="aurora" style="position:absolute"><i></i><i></i><i></i></div>
<section class="sheet open" aria-label="Drawer" style="position:absolute;height:300px;visibility:visible;transform:none;padding-bottom:0"><div class="sheet-grab"><i></i></div><div class="sheet-head"><div class="seg" role="group"><button type="button" aria-pressed="true">Compounds</button><button type="button" aria-pressed="false">Reagents</button></div><span class="sheet-tip">Tap to add · hold to drag</span><button class="btn" type="button">Done</button></div>
<div class="sheet-body"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 14px"><div class="panel" style="padding:10px;border-radius:var(--r-md);font:650 12px/1.2 var(--f-body);height:72px;display:flex;align-items:flex-end">methane</div><div class="panel" style="padding:10px;border-radius:var(--r-md);font:650 12px/1.2 var(--f-body);height:72px;display:flex;align-items:flex-end">ethene</div><div class="panel" style="padding:10px;border-radius:var(--r-md);font:650 12px/1.2 var(--f-body);height:72px;display:flex;align-items:flex-end">propene</div><div class="panel" style="padding:10px;border-radius:var(--r-md);font:650 12px/1.2 var(--f-body);height:72px;display:flex;align-items:flex-end">benzene</div><div class="panel" style="padding:10px;border-radius:var(--r-md);font:650 12px/1.2 var(--f-body);height:72px;display:flex;align-items:flex-end">phenol</div><div class="panel" style="padding:10px;border-radius:var(--r-md);font:650 12px/1.2 var(--f-body);height:72px;display:flex;align-items:flex-end">glycine</div></div></div></section>
<nav class="dock" style="position:absolute;bottom:8px"><button type="button"><span>Compounds</span><b>8</b></button><button type="button" class="nudge"><span>Reagents</span></button></nav></div>
<script>Playground.indicators();</script>
</body></html>
