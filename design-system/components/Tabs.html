<!DOCTYPE html><html><head><link rel="stylesheet" href="../css/playground.css"><script src="../js/playground.js"></script><script>Playground.initTheme();addEventListener("storage",e=>{if(!e.key||!e.key.startsWith("chem-"))return;const g=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};Playground.setTheme({palette:g("chem-palette","catppuccin"),mode:g("chem-mode","auto")});});</script><meta charset="utf-8"><style>body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}</style></head><body>
<nav class="tabs" role="tablist" aria-label="Mode" style="width:max-content"><button role="tab" aria-selected="false">Lab</button><button role="tab" aria-selected="true">Synthesis</button><button role="tab" aria-selected="false">Identify</button><button role="tab" aria-selected="false">Codex</button></nav>
<script>Playground.indicators();document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));});</script>
</body></html>
