<!DOCTYPE html><html><head><link rel="stylesheet" href="../css/playground.css"><script src="../js/playground.js"></script><script>Playground.initTheme();addEventListener("storage",e=>{if(!e.key||!e.key.startsWith("chem-"))return;const g=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};Playground.setTheme({palette:g("chem-palette","catppuccin"),mode:g("chem-mode","auto")});});</script><meta charset="utf-8"><style>body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}</style></head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap"><div class="seg" role="group" aria-label="Formula style"><button type="button" aria-pressed="true">Skeletal</button><button type="button" aria-pressed="false">Displayed</button><button type="button" aria-pressed="false">Structural</button></div>
<div class="seg" role="group" aria-label="Layout"><button type="button" aria-pressed="false">Cards</button><button type="button" aria-pressed="true">Flowchart</button></div></div>
<script>Playground.indicators();document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(b)s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));</script>
</body></html>
