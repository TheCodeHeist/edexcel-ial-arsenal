<!DOCTYPE html><html><head><link rel="stylesheet" href="../css/playground.css"><script src="../js/playground.js"></script><script>Playground.initTheme();addEventListener("storage",e=>{if(!e.key||!e.key.startsWith("chem-"))return;const g=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};Playground.setTheme({palette:g("chem-palette","catppuccin"),mode:g("chem-mode","auto")});});</script><meta charset="utf-8"><style>body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="fchip" aria-pressed="true">All types</button><button class="fchip t-redox" aria-pressed="false">Redox</button><button class="fchip t-subst" aria-pressed="true">Substitution</button><button class="fchip t-addn" aria-pressed="false">Addition</button><button class="fchip t-cond" aria-pressed="false">Condensation</button></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="badge f-redox" style="margin:0">Redox</span><span class="badge f-subst" style="margin:0">Substitution</span><span class="badge f-addn" style="margin:0">Addition</span><span class="badge f-elim" style="margin:0">Elimination</span><span class="badge f-cond" style="margin:0">Condensation</span><span class="badge f-acid" style="margin:0">Acid–base</span><span class="badge solid f-subst" style="margin:0">Solid</span><span class="chip">Nucleophilic substitution</span></div></div>
<script>document.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));</script>
</body></html>
