<!DOCTYPE html><html><head><link rel="stylesheet" href="../css/playground.css"><script src="../js/playground.js"></script><script>Playground.initTheme();addEventListener("storage",e=>{if(!e.key||!e.key.startsWith("chem-"))return;const g=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}};Playground.setTheme({palette:g("chem-palette","catppuccin"),mode:g("chem-mode","auto")});});</script><meta charset="utf-8"><style>body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}</style></head><body>
<div class="rxc" style="max-width:480px;--tc:var(--accent)"><div class="rxc-top"><span class="e-r">propene + HBr → ?</span><span class="badge f-addn">Addition</span></div>
<div class="qz"><p id="pr">What forms?</p><div class="qo"><button type="button" data-a="1">2-bromopropane</button><button type="button">1-bromopropane</button><button type="button">1,2-dibromopropane</button><button type="button">propan-2-ol</button></div></div></div>
<script>const q=document.querySelector('.qz');q.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const ok=!!b.dataset.a;q.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add('right');});if(!ok)b.classList.add('wrong');document.getElementById('pr').innerHTML='<span class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not quite — it’s 2-bromopropane.')+'</span>';});</script>
</body></html>
