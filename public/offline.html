<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline · Edexcel IAL Arsenal</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f6f7fb; color: #111827;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b1020; color: #eef2ff; }
      .card { background: #141b31; border-color: rgba(255,255,255,.14); }
      p { color: #b7c2df; }
    }
    .card {
      max-width: 440px; width: 100%; padding: 26px 24px; border-radius: 18px;
      background: #ffffff; border: 1px solid rgba(17,24,39,.12);
      box-shadow: 0 18px 45px rgba(15,23,42,.12);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #475569; font-size: 14.5px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-block; padding: 9px 15px; border-radius: 999px;
      text-decoration: none; font-weight: 600; font-size: 13.5px;
      background: #2563eb; color: #fff;
    }
    a.sec { background: transparent; color: inherit; border: 1px solid currentColor; opacity: .82; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You’re offline</h1>
    <p>This page hasn’t been cached on your device yet. Reconnect to load new pages, or jump back to an offline-ready hub page:</p>
    <nav class="links">
      <a href="/">Home hub</a>
      <a class="sec" href="/chemistry/">Chemistry</a>
      <a class="sec" href="/physics/">Physics</a>
    </nav>
  </main>
</body>
</html>
